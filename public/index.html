<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EduPortal - Student & Teacher Management System" />
    <meta name="theme-color" content="#0a7ea4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduPortal" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Icons -->
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />
    
    <title>EduPortal</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #ffffff;
      }

      #root {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .splash {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a7ea4 0%, #1a9fcf 100%);
      }

      .splash-icon {
        width: 120px;
        height: 120px;
        margin-bottom: 40px;
        animation: pulse 2s ease-in-out infinite;
      }

      .splash-text {
        color: white;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .splash-subtext {
        color: rgba(255, 255, 255, 0.9);
        font-size: 16px;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img src="/icon.png" alt="EduPortal" class="splash-icon" />
        <div class="splash-text">EduPortal</div>
        <div class="splash-subtext">Loading...</div>
      </div>
    </div>

    <script>
      // Register service worker for PWA capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then(registration => {
              console.log('EduPortal: Service Worker registered', registration);
              
              // Check for updates periodically
              setInterval(() => {
                registration.update();
              }, 60000); // Check every minute
            })
            .catch(error => {
              console.warn('EduPortal: Service Worker registration failed', error);
            });
        });
      }

      // Add to home screen prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('EduPortal: Install prompt available');
      });

      // Listen for successful app installation
      window.addEventListener('appinstalled', () => {
        console.log('EduPortal: App installed successfully');
        deferredPrompt = null;
      });
    </script>

    <!-- Expo Root -->
    <script src="./index.js" type="module"></script>
  </body>
</html>
